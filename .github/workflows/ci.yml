name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # runs the .ts self-checks directly (type stripping)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ESLint exits non-zero only on errors; warnings are reported but don't fail the job.
      - name: Lint
        run: npm run lint

      - name: Self-checks
        run: npm run check
